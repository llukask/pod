# Example Pod server config. Copy to pod.toml (gitignored) or point
# POD_CONFIG at another path. Every key can be overridden by a POD_* env var
# of the same name in upper case, e.g. POD_LISTEN_ADDR.

# Postgres connection string. Falls back to DATABASE_URL when neither this
# key nor POD_DATABASE_URL is set. `scripts/dev-db.sh url` prints one for the
# local throwaway cluster.
database_url = "postgresql://pod:pod@localhost:5432/pod"

# Public URL of this server. Feed hosts see it in the poller's User-Agent.
base_url = "http://localhost:3000"

listen_addr = "0.0.0.0:3000"

# Seconds between successful polls of one feed (plus up to 10 % jitter).
poll_interval_secs = 900

poller_workers = 4

# Hosts the fetch guard lets through although they are private or loopback,
# for feeds self-hosted on a LAN. Entries are host names (exact match, all
# their addresses allowed), IP addresses or CIDRs (any host resolving inside
# them allowed), e.g. ["nas.lan", "192.168.1.20", "10.0.0.0/8"]. Other hosts
# are limited to ports 80 and 443. A URL whose host is an entry (nas.lan) or a
# literal IP inside one (http://192.168.1.20:8080/) may use any port; a host
# name that merely resolves inside a CIDR entry may not.
fetch_allowlist = []

allow_registration = true

# The login and register rate limits key on the client IP. Behind a reverse
# proxy every TCP peer is the proxy, so name the header in which it passes the
# client address, e.g. "X-Real-IP" for nginx with
#   proxy_set_header X-Real-IP $remote_addr;
# The header must hold exactly one address, so X-Forwarded-For lists don't
# work. It is honoured only from peers in trusted_proxies (IP addresses or
# CIDRs, default loopback); any other peer is the client itself. Unset, the
# TCP peer is always the client IP.
# client_ip_header = "X-Real-IP"
trusted_proxies = ["127.0.0.0/8", "::1/128"]

# The podcast directory behind /v1/directory/search: an iTunes Search API
# compatible service, with /search appended to this URL's path. Its host and
# port are trusted, so a mirror on the LAN works without fetch_allowlist.
directory_base_url = "https://itunes.apple.com"

# Sonos speakers to ask for the household topology, tried in order until one
# answers. Any one speaker knows every group, so one reachable entry is
# enough. Entries are host names or IP addresses (UPnP on port 1400), or
# host:port for another port. Empty turns Sonos playback off.
sonos_hosts = []

# The built web client (`npm run build` in web/, or the flake's pod-web package),
# served at every path the API doesn't claim. Unset, the server is API-only.
# web_dir = "web/dist"
