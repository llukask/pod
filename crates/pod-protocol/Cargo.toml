[package]
name = "pod-protocol"
version.workspace = true
edition.workspace = true

[dependencies]
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["uuid"] }
uuid = { version = "1.29.0", features = ["v5", "v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
jsonschema = { version = "0.60.1", default-features = false }
