[package]
name = "pod-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
color-eyre = "0.6.5"
dirs = "7.0.0"
gpui-kit = "=0.8.0"
pod-protocol = { version = "0.2.0", path = "../pod-protocol" }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
gpui-kit = { version = "=0.8.0", features = ["test-support"] }
