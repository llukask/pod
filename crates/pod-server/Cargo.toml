[package]
name = "pod-server"
version.workspace = true
edition.workspace = true

[dependencies]
ammonia = "4.2.4"
argon2 = "0.6.0"
axum = "0.8"
base64 = "0.23.1"
bytes = "1"
color-eyre = "0.6.5"
feed-rs = "3.0.0"
getrandom = "0.4.3"
httpdate = "1.0.3"
ipnet = "2"
jiff-sqlx = { version = "0.2.0", features = ["postgres"] }
percent-encoding = "2.3.2"
pod-protocol = { version = "0.2.0", path = "../pod-protocol" }
quick-xml = { version = "0.42", features = ["encoding"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "uuid", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
insta = "1.49.0"
tower = { version = "0.5.3", features = ["util"] }
