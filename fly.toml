# Fly.io config for the Pod server. First-time setup is in README.md
# ("Deploy"). See https://fly.io/docs/reference/configuration/.

# TODO: set to the app created with `fly apps create`. This is a separate app
# from the one serving pod-morning-water-8528, so a deploy can't replace the
# running server; it starts on an empty database.
app = 'pod-v2'
primary_region = 'fra'

# The server handles SIGTERM by letting in-flight requests finish and
# cancelling the poller, whose leases make interrupted feeds due again. Fly
# sends SIGKILL once the timeout runs out.
kill_signal = 'SIGTERM'
kill_timeout = '30s'

# DATABASE_URL is a secret set by `fly postgres attach`.
[env]
  POD_LISTEN_ADDR = '0.0.0.0:8080'
  # TODO: update together with `app`, or to the custom domain.
  POD_BASE_URL = 'https://pod-v2.fly.dev'
  POD_ALLOW_REGISTRATION = 'false'
  # Fly's proxy sets Fly-Client-IP; without this every client shares the
  # proxy's rate-limit bucket.
  POD_TRUST_FLY_CLIENT_IP = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  # The feed poller runs inside the server process, so a stopped machine
  # stops polling. Keep the one machine running regardless of traffic.
  auto_stop_machines = 'off'
  auto_start_machines = true
  processes = ['app']

  # The server runs migrations before it binds the port, so the grace period
  # covers a slow migration on deploy.
  [[http_service.checks]]
    method = 'GET'
    path = '/healthz'
    grace_period = '30s'
    interval = '15s'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpus = 1
