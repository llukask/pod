name: Release

# Pushing a tag `vX.Y.Z` builds the desktop client for Linux and the Android
# app, and publishes them as a GitHub release. The tag must match the
# workspace version in Cargo.toml. Running the workflow by hand builds the
# same files as workflow artifacts without releasing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      # Android needs an increasing integer next to the version name:
      # major * 1_000_000 + minor * 1_000 + patch.
      - id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::workspace version '$version' is not X.Y.Z"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      NAME: pod-desktop-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      # The same libraries as ci.yml's desktop job, without the test-only ones.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxcb1-dev libvulkan-dev \
            libmpv-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Build
        run: cargo build --release --locked -p pod-desktop

      - name: Package
        run: |
          mkdir "$NAME"
          cp target/release/pod-desktop packaging/linux/* "$NAME/"
          strip "$NAME/pod-desktop"
          tar -czf "$NAME.tar.gz" "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      NAME: pod-${{ needs.version.outputs.version }}.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # app/build.gradle.kts signs release builds with the key POD_KEYSTORE
      # points at. Without it the APK would be unsigned and not installable.
      - name: Write the signing key
        env:
          POD_KEYSTORE_BASE64: ${{ secrets.POD_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$POD_KEYSTORE_BASE64" ]]; then
            echo "::error::the POD_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$POD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pod-release.p12"
          echo "POD_KEYSTORE=$RUNNER_TEMP/pod-release.p12" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          POD_KEYSTORE_PASSWORD: ${{ secrets.POD_KEYSTORE_PASSWORD }}
          POD_KEY_ALIAS: ${{ secrets.POD_KEY_ALIAS }}
          POD_KEY_PASSWORD: ${{ secrets.POD_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -Ppod.versionName=${{ needs.version.outputs.version }} \
            -Ppod.versionCode=${{ needs.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk "../$NAME"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "../$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## Downloads

          - **Android** (14 or newer): `pod-*.apk`. It installs as `ltd.kilian.pod`, next to any debug build.
          - **Linux**: `pod-desktop-*-linux-<arch>.tar.gz`. Unpack it and run `./install.sh`, which installs to `~/.local`. It needs libmpv, fontconfig, xkbcommon, libdbus and a Vulkan driver from your distribution, for example on Debian or Ubuntu: `sudo apt install libmpv2 libfontconfig1 libxkbcommon-x11-0 libdbus-1-3 libvulkan1`. The binary needs glibc 2.39 or newer (Ubuntu 24.04, Debian 13, Fedora 40). With Nix, `nix run github:llukask/pod/@TAG@` instead.

          EOF
          sed -i "s|@TAG@|$GITHUB_REF_NAME|" notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "pod $VERSION" \
            --notes-file notes.md \
            --generate-notes
