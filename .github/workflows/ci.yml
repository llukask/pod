name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pod
          POSTGRES_PASSWORD: pod
          POSTGRES_DB: pod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pod:pod@localhost:5432/pod
      # Build the query macros from the committed .sqlx cache, as the Docker
      # build does. The sqlx step below proves the cache is current. Tests
      # still connect to DATABASE_URL at runtime.
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli@0.9.0 --locked --no-default-features --features postgres,rustls

      - name: Check the sqlx offline cache
        env:
          SQLX_OFFLINE: "false"
        run: |
          sqlx migrate run --source crates/pod-server/migrations
          cargo sqlx prepare --workspace --check -- --all-targets

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
