name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The server and the desktop client build in separate jobs. GPUI needs
# display and font libraries the server never links, and takes a while to
# compile, so server checks neither wait on it nor fail on a GUI dependency.
jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pod
          POSTGRES_PASSWORD: pod
          POSTGRES_DB: pod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pod:pod@localhost:5432/pod
      # Build the query macros from the committed .sqlx cache, as offline
      # builds do. The sqlx step below proves the cache is current. Tests
      # still connect to DATABASE_URL at runtime.
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli@0.9.0 --locked --no-default-features --features postgres,rustls

      - name: Check the sqlx offline cache
        env:
          SQLX_OFFLINE: "false"
        run: |
          sqlx migrate run --source crates/pod-server/migrations
          cargo sqlx prepare --workspace --check -- --all-targets -p pod-protocol -p pod-server

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p pod-protocol -p pod-server --all-targets -- -D warnings

      # `--all-targets` unifies dev-dependency features into the binary's
      # build, so a feature only the tests enable would hide a broken server
      # build. This builds the binary on its own, as `nix build` does.
      - name: Build binary
        run: cargo build -p pod-server

      - name: Test
        run: cargo test -p pod-protocol -p pod-server

  desktop:
    runs-on: ubuntu-latest

    # The sync engine's tests run a real pod-server against a fresh database
    # per test, created from DATABASE_URL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pod
          POSTGRES_PASSWORD: pod
          POSTGRES_DB: pod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pod:pod@localhost:5432/pod
      # pod-server, a dev-dependency, builds its query macros from the
      # committed .sqlx cache, which the check job keeps current.
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4

      # The libraries GPUI links on Linux, plus libmpv for playback and
      # libdbus for the media controls (dbus-daemon for the D-Bus tests).
      # flake.nix lists the same set for `nix develop` and `nix build`.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxcb1-dev libvulkan-dev \
            libmpv-dev libdbus-1-dev dbus

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p pod-desktop --all-targets -- -D warnings

      # `--all-targets` unifies dev-dependency features into the binary's
      # build, so a feature only the tests enable would hide a broken release
      # build. This builds the binary on its own.
      - name: Build binary
        run: cargo build -p pod-desktop

      # The shell test renders in GPUI's test platform, so it needs no display.
      - name: Test
        run: cargo test -p pod-desktop


  # The Android client in android/. `core` is plain JVM; the app's tests run
  # on Robolectric. Both read the conformance fixtures and openapi.json from
  # the repo root.
  android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug
